<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MH Movies</title>
    <link rel="stylesheet" href="play.css">
</head>

<body>

<header class="player-header">
    <button id="backButton" class="back-button" type="button">←</button>

    <div class="player-logo">
        <img src="https://d1yei2z3i6k35z.cloudfront.net/15725186/6a9929374834e7.77243010_1000014592.jpg" alt="MH Movies">
        <span>MH MOVIES</span>
    </div>
</header>

<main class="player-page">
    <section id="nativePlayerHost" class="native-player-host"></section>

    <section class="movie-info">

        <h1 id="movieTitle">Loading...</h1>

        <div id="movieMeta" class="movie-meta"></div>

        <p id="movieOverview" class="movie-overview"></p>

    </section>

    <section id="sourceSelector" class="source-selector"></section>

    <section id="subtitleSelector" class="subtitle-selector"></section>

    <section class="download-section">

        <button
            id="downloadMovieButton"
            class="download-button"
            type="button"
        >
            Download Movie
        </button>

        <div
            id="downloadStatus"
            class="download-status"
        ></div>

    </section>

</main>

<div id="loadingOverlay" class="player-overlay hidden">
    <div class="loading-spinner"></div>
    <h2>Loading movie</h2>
    <p>Please wait...</p>
</div>

<div id="noSourceOverlay" class="player-overlay hidden">
    <div class="overlay-icon">⚠️</div>
    <h2>No playable source</h2>
    <p>This movie does not currently have a playable source.</p>
</div>

<div id="errorOverlay" class="player-overlay hidden">
    <div class="overlay-icon">⚠️</div>
    <h2>Playback error</h2>
    <p id="errorMessage">Unable to start playback.</p>
    <button id="retryButton" class="download-button" type="button">
        Retry
    </button>
</div>

<script src="play.js"></script>

</body>
</html>
