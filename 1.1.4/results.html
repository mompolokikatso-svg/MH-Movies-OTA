<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MH Movies — Results</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="top-header">
        <button id="resultsBackButton" class="back-button">←</button>
        <div class="logo">
            <img src="https://d1yei2z3i6k35z.cloudfront.net/15725186/6a9929374834e7.77243010_1000014592.jpg" alt="MH Movies">
            <span>MH Movies</span>
        </div>
        <button id="themeButton" class="theme-button">🌙</button>
    </header>

    <main>
        <section class="search-results-page">
            <div class="search-results-header">
                <h2 id="resultsTitle">Loading...</h2>
            </div>

            <div id="resultsGrid" class="movie-grid"></div>

            <div id="resultsPagination" class="pagination">
                <button id="resultsPrev" class="page-button">← Previous</button>
                <span id="resultsPageNumber">Page 1</span>
                <button id="resultsNext" class="page-button">Next →</button>
            </div>
        </section>
    </main>

    <script src="results.js"></script>
</body>
</html>
