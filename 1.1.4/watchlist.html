<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MH Movies - Watchlist</title>

    <link
        rel="stylesheet"
        href="watchlist.css"
    >

</head>

<body>

    <header class="top-header">

        <button
            id="backButton"
            class="back-button"
        >
            ←
        </button>

        <div class="logo">
            <span>❤️ Watchlist</span>
        </div>

    </header>


    <main id="watchlistPage">

        <div
            id="watchlistGrid"
            class="movie-grid"
        ></div>

        <div
            id="emptyWatchlist"
            class="empty-watchlist"
        >
            Your Watchlist is empty.
        </div>

    </main>


    <script src="watchlist.js"></script>

</body>

</html>
